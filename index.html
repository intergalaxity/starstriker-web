<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSTRIKER // HOME</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/></svg>">
    <style>
        @font-face {
            font-family: 'CenturyGothicItalic';
            src: url('century-gothic-italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            position: relative;
            padding-top: 30px;
            min-height: 100px;
            width: 100%;
            flex-shrink: 0;
        }

        .brand-container {
            position: absolute;
            top: 30px;
            left: 30px;
            pointer-events: none;
        }

        .nav-container {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
        }

        .highlight-text {
            font-family: 'CenturyGothicItalic', sans-serif;
            font-style: italic;
            font-size: 1.5rem;
            letter-spacing: 1.2px;
            color: #000000;
            background-color: #ffffff;
            padding: 2px 6px;
            line-height: 1; 
            display: inline-block;
            text-transform: uppercase;
            vertical-align: top;
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px; 
            height: 2px;
            background-color: transparent;
            transition: background-color 0.1s;
        }

        .nav-link:hover::after {
            background-color: #ffffff;
            cursor: pointer;
        }

        .header-line {
            position: absolute;
            top: 80px;
            left: 30px;
            right: 30px;
            height: 2px;
            background-color: #ffffff;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center; 
            justify-content: center;
            padding: 0 30px;
            text-align: center;
        }

        .content-row {
            display: block;
        }


        footer {
            padding: 40px 30px;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .footer-text {
            font-size: 1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container">
            <span class="highlight-text">STARSTRIKER</span>
        </div>

        <nav class="nav-container">
            <a href="https://starstriker.vescence.xyz/music" class="nav-link highlight-text">MUSIC</a>
            <a href="https://starstriker.vescence.xyz/socials" class="nav-link highlight-text">SOCIALS</a>
        </nav>

        <div class="header-line"></div>
    </header>

    <main>
        <div class="content-row">
            <span class="highlight-text">Starstriker is the duo electronic project of Vortex Child and THE peanut.</span>
        </div>
    </main>

    <footer>
        <div class="content-row">
            <span class="highlight-text footer-text">© 2026 // STARSTRIKER</span>
        </div>
    </footer>
</body>
</html>
