<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARSTRIKER // SOCIALS</title>

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://starstriker.vescence.xyz/socials">
    <meta property="og:title" content="STARSTRIKER // SOCIALS">
    <meta property="og:description" content="Connect with STARSTRIKER on Instagram and Bandcamp.">
    <meta name="theme-color" content="#FFFFFF">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/></svg>">
    
    <style>
        @font-face {
            font-family: 'CenturyGothicItalic';
            src: url('century-gothic-italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            scrollbar-width: none;
            color: #ffffff;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        header {
            position: relative;
            padding-top: 30px;
            min-height: 100px;
            width: 100%;
            flex-shrink: 0;
        }

        .brand-container {
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .nav-container {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
        }

        .highlight-text {
            font-family: 'CenturyGothicItalic', sans-serif;
            font-style: italic;
            font-size: 1.5rem;
            letter-spacing: 1.2px;
            color: #000000;
            background-color: #ffffff;
            padding: 2px 6px;
            line-height: 1; 
            display: inline-block;
            text-transform: uppercase;
            vertical-align: top;
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        .nav-link {
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .nav-link:active {
            transform: scale(0.98);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: -4px; 
            height: 2px;
            background-color: transparent;
            transition: background-color 0.1s;
        }

        .nav-link:hover::after {
            background-color: #ffffff;
        }

        .header-line {
            position: absolute;
            top: 80px;
            left: 30px;
            right: 30px;
            height: 2px;
            background-color: #ffffff;
        }

        main {
            flex: 1;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
        }

        .social-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .small-highlight {
            font-size: 0.8rem;
            letter-spacing: 0.8px;
            padding: 1px 4px;
        }

        footer {
            padding: 20px 30px;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .footer-text {
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container">
            <a href="https://starstriker.vescence.xyz/" class="highlight-text nav-link">STARSTRIKER</a>
        </div>

        <nav class="nav-container">
            <a href="https://starstriker.vescence.xyz/" class="nav-link highlight-text">HOME</a>
            <a href="https://starstriker.vescence.xyz/music" class="nav-link highlight-text">MUSIC</a>
        </nav>

        <div class="header-line"></div>
    </header>

    <main>
        <div class="social-row">
            <span class="highlight-text">INSTAGRAM</span>
            <a href="https://www.instagram.com/xstarstriker/" target="_blank" class="nav-link highlight-text small-highlight">@XSTARSTRIKER</a>
        </div>

        <div class="social-row">
            <span class="highlight-text">BANDCAMP</span>
            <a href="https://starstriker.bandcamp.com/" target="_blank" class="nav-link highlight-text small-highlight">STARSTRIKER.BANDCAMP.COM</a>
        </div>
    </main>

    <footer>
        <span class="highlight-text footer-text">© 2026 // STARSTRIKER</span>
    </footer>
</body>
</html>
